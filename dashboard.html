<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="dashboard">

        <div class="sidebar">

            <h2>StudySync</h2>

           <a href="dashboard.html">Dashboard</a>
<a href="tasks.html">Tasks</a>
<a href="#">Goals</a>
<a href="#">Settings</a>

        </div>


        <div class="main-content">

            <h1>Student Dashboard</h1>
            <p class="welcome-text">
    Welcome back! Stay focused and complete your goals today.
</p>

            <div class="dashboard-cards">

                <div class="dash-card">
                    <h3>Tasks</h3>

<p id="dashboardTasks">0</p>
                </div>

                <div class="dash-card">
                    <h3>Pending</h3>

<p id="dashboardPending">0</p>
                </div>

                <div class="dash-card">
                    <h3>Completed</h3>

<p id="dashboardCompleted">0</p>
                </div>

                 <div class="dash-card">

    <h3>Progress</h3>

    <div class="progress-bar">

        <div id="progressFill"></div>

    </div>

    <p id="dashboardProgress">0%</p>

</div>

            </div>

        </div>

    </div>
   
<script src="dashboard.js"></script>
</body>
</html>
